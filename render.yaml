# Blueprint do Render: cria o web service e o PostgreSQL gratuito.
services:
  - type: web
    name: cupcake-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # cria as tabelas e os dados de demonstração na primeira subida
    startCommand: flask --app wsgi seed --se-vazio && gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cupcake-db
          property: connectionString

databases:
  - name: cupcake-db
    plan: free
